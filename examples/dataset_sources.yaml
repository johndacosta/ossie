# Dataset sources. See "Source" in core-spec/spec.md.
version: 0.2.0.dev0
name: Dataset sources
datasets:
# A string in shorthand form names a table: its parts are split on ".".
- name: customers
  source: crm.public.customers
  primary_key: [customer_id]
  fields:
  - name: customer_id
    expression:
      sql: customer_id

# The list form names any table, including one whose own name contains a dot,
# as Apache Polaris allows. The connection that reaches it is each consumer's;
# a producer that needs its own keeps it in custom_extensions, never secrets.
- name: eu_customers
  source:
    kind: table
    identifier: [prod, sales, eu.customers]
  custom_extensions:
  - vendor_name: BI_TOOL
    data: '{"connection": "warehouse_prod"}'
  fields:
  - name: customer_id
    expression:
      sql: customer_id

# Quote a part that YAML would otherwise read as a number.
- name: orders_2024
  source:
    kind: table
    identifier: [sales, "2024", orders]
  fields:
  - name: order_id
    expression:
      sql: order_id
